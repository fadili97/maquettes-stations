const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c)));
}
async function go(pw,silent){
  let h;try{h=await dec(pw)}catch(x){if(!silent)document.getElementById('e').textContent='Mot de passe incorrect';return}
  try{sessionStorage.setItem('mq_pw',pw)}catch(x){}
  document.open();document.write(h);document.close();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value)};
let s=null;try{s=sessionStorage.getItem('mq_pw')}catch(x){}
if(s)go(s,true);})();
